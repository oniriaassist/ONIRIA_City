services:
  postgres:
    image: postgres:16
    container_name: oniria-city-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-oniria_city}
      POSTGRES_USER: ${POSTGRES_USER:-oniria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5433:5432"
    volumes:
      - oniria_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-oniria_city}
      POSTGRES_USER: ${POSTGRES_USER:-oniria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ONIRIA_DATABASE_DIR: /database
    volumes:
      - ./database:/database:ro
    command: ["python", "scripts/run_migrations.py"]
    restart: "no"

  admin-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-admin-bootstrap
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-oniria_city}
      POSTGRES_USER: ${POSTGRES_USER:-oniria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      ONIRIA_ADMIN_UPDATE_PASSWORD: ${ONIRIA_ADMIN_UPDATE_PASSWORD:-false}
    command: ["python", "scripts/create_admin.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-backend
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-oniria_city}
      POSTGRES_USER: ${POSTGRES_USER:-oniria_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
    ports:
      - "7000:7000"
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oniria-city-frontend
    environment:
      INTERNAL_API_BASE_URL: http://backend:7000
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oniria_postgres_data:
