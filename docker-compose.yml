services:
  mysql:
    image: mysql:8.4
    container_name: oniria-city-mysql
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oniria_city}
      MYSQL_USER: ${MYSQL_USER:-oniria_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - oniria_mysql_data:/var/lib/mysql
      - ./database/mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  migrate:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-migrate
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oniria_city}
      MYSQL_USER: ${MYSQL_USER:-oniria_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ONIRIA_DATABASE_DIR: /database
    volumes:
      - ./database:/database:ro
    command: ["python", "scripts/run_migrations.py"]
    restart: "no"

  admin-bootstrap:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-admin-bootstrap
    env_file:
      - ./backend/.env
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oniria_city}
      MYSQL_USER: ${MYSQL_USER:-oniria_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      ONIRIA_ADMIN_UPDATE_PASSWORD: ${ONIRIA_ADMIN_UPDATE_PASSWORD:-false}
    command: ["python", "scripts/create_admin.py"]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: oniria-city-backend
    env_file:
      - ./backend/.env
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:-oniria_city}
      MYSQL_USER: ${MYSQL_USER:-oniria_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "7000:7000"
    depends_on:
      admin-bootstrap:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:7000/api/health', timeout=5).read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: oniria-city-frontend
    environment:
      INTERNAL_API_BASE_URL: http://backend:7000
      NEXT_PUBLIC_API_BASE_URL: /api
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  oniria_mysql_data:
